# Publishes with npm's trusted publishing, using the OIDC token GitHub Actions
# issues for this repository and this workflow file. There is no NPM_TOKEN and
# there should never be one.
#
# The trusted publisher is configured on the package at npmjs.com and names
# this repository and this filename. Renaming this file or moving the
# repository invalidates it, and that is the intended behaviour. Job names are
# not part of that configuration, so the split below does not touch it.
#
# Two jobs, on purpose. `publish` holds the token that can publish as this
# package and can only read the repository. `release` can write to the
# repository and holds no token, no checkout and no registry credential. The
# third party action that writes the release runs in the second one, so the job
# it runs in has nothing worth taking.
#
# Every `uses:` names a commit sha rather than a tag, because a tag is a
# pointer its owner can move. The version in the trailing comment is for a
# reader; dependabot keeps the two in step. See .github/dependabot.yml.
name: publish-npm

on:
  push:
    tags:
      - 'v*.*.*'
      - '@hexpro/private-image-converter@*'

# Nothing by default, granted per job below.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Mints the OIDC token, which npm's trusted publishing and the build
      # provenance attestation both need.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later. Node 22 ships npm 10.
      - run: npm install -g npm@^11

      - run: pnpm install --frozen-lockfile

      # Repeated from ci.yml on purpose: a tag ref does not match that
      # workflow's branch filter, so this is the only gate that runs here.
      - name: Assert zero runtime dependencies
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$count" != "0" ]; then
            echo "This package must have no runtime dependencies, found $count."
            exit 1
          fi

      - name: Verify the version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag##*@}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run build:all

      # The offline app is the file people download and open against their own
      # photographs, so its digest has to end up somewhere that outlives this
      # run. A step summary does not: it is not on the release page and it goes
      # when the run's logs go. SHA256SUMS is written in the format
      # `sha256sum -c` reads, staged beside the file it describes, and attached
      # to the release further down. The summary line stays because it is
      # convenient for whoever is watching the run, not because anybody should
      # verify a download against it.
      - name: Record the offline app's digest
        run: |
          mkdir release
          cp dist/private-image-converter.html release/
          (cd release && sha256sum private-image-converter.html > SHA256SUMS)
          {
            echo '### Offline application'
            echo ''
            echo "sha256: $(cut -d' ' -f1 release/SHA256SUMS)"
            echo "bytes: $(stat -c%s release/private-image-converter.html)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Signed by GitHub against this workflow run and this commit, so a
      # downloader can ask where the file came from rather than take the
      # release page's word for it. `gh attestation verify` checks it.
      - name: Attest the offline app
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/private-image-converter.html

      # The release job has no checkout and runs no build, so dist/ does not
      # exist there. This is how the two files reach it.
      - name: Hand the release files to the next job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

      - run: pnpm pack --dry-run

      - run: npm publish --access public --provenance

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release

      # Checked rather than assumed, so the digest quoted in the notes
      # describes the bytes being attached here and not the bytes that were
      # hashed in another job.
      - name: Check the files against SHA256SUMS
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS

      - name: Write the release notes
        run: |
          file=release/private-image-converter.html
          {
            echo '## The offline application'
            echo ''
            echo '`private-image-converter.html` is the whole tool in one file. Open it from'
            echo 'your own disc with the network off.'
            echo ''
            echo '```'
            echo "sha256  $(cut -d' ' -f1 release/SHA256SUMS)"
            echo "bytes   $(stat -c%s "$file")"
            echo '```'
            echo ''
            echo 'The digest is also in `SHA256SUMS` below. Download the two files into'
            echo 'the same directory and run `sha256sum -c SHA256SUMS`.'
            echo ''
            echo 'GitHub signed a build provenance attestation for this file:'
            echo ''
            echo '```'
            echo "gh attestation verify private-image-converter.html --repo $GITHUB_REPOSITORY"
            echo '```'
            echo ''
            echo 'The build is deterministic, so the digest can be reproduced from source.'
            echo 'RELEASING.md has the recipe.'
          } > notes.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release/private-image-converter.html
            release/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: notes.md
          generate_release_notes: true
